name: SlimeCustomizer Legacy API compatibility

on:
  push:
    branches:
      - feature/slimefun-legacy-paper-26x
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          - "1.21.11-R0.1-SNAPSHOT"
          - "26.3.build.166-beta"
    steps:
      - uses: actions/checkout@v4
      - name: Java 25 toolchain (emit Java 21 bytecode)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install published Slimefun-Legacy 4.1.80 API
        run: bash scripts/install-slimefun-legacy.sh
      - name: Compile against Paper API ${{ matrix.paper }}
        run: mvn -B -Dpaper.api.version=${{ matrix.paper }} clean verify
      - name: Verify startup config assets are inside the JAR
        run: |
          for file in categories.yml items.yml mob-drops.yml machines.yml generators.yml solar-generators.yml; do
            jar tf target/SlimeCustomizer-1.1.0-legacy-SNAPSHOT.jar | grep -qx "$file"
          done
      - name: Check runnable jar contents
        run: |
          jar tf target/SlimeCustomizer-1.1.0-legacy-SNAPSHOT.jar | grep -q '^plugin.yml$'
          jar tf target/SlimeCustomizer-1.1.0-legacy-SNAPSHOT.jar | grep -q '^slimefun-compatibility.json$'
          jar tf target/SlimeCustomizer-1.1.0-legacy-SNAPSHOT.jar | grep -q '^io/ncbpfluffybear/slimecustomizer/RuntimeCompatibility.class$'
      - name: Upload test JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SlimeCustomizer-Legacy-${{ matrix.paper }}
          path: target/SlimeCustomizer-1.1.0-legacy-SNAPSHOT.jar
          retention-days: 7
